services:
  - type: web
    name: aviance-seo-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: auto
      - key: AI_MODEL_ID
        value: gemma4:31b
      - key: AI_API_KEY
        sync: false
      - key: AI_RAG_ENABLED
        value: "true"
      - key: AI_VALIDATION_ENABLED
        value: "true"
      - key: AI_FALLBACK_ENABLED
        value: "true"
