# CI/CD Pipeline for eSupport SEO Platform
name: CI Pipeline

on:
  push:
    branches: [ main, master, site-cheack ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Unit Tests & Validations
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Code Syntax
        run: |
          python -m py_compile backend/main.py
          if [ -f scripts/seed_db.py ]; then python -m py_compile scripts/seed_db.py; fi

      - name: Run Test Suite
        env:
          DATABASE_URL: "sqlite:///test_ci.db"
          APP_ENV: "testing"
        run: |
          python -m unittest discover tests -v

      - name: Run Database Seeder Smoke Test
        env:
          DATABASE_URL: "sqlite:///test_ci.db"
        run: |
          if [ -f scripts/seed_db.py ]; then python scripts/seed_db.py --quiet; else echo "No seeder script on this branch, skipping"; fi

  docker-build:
    name: Validate Docker Container Build
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: esupport-seo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
